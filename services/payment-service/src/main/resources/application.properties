spring.application.name=paymentservice
server.port=8084

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/payment_db}
spring.data.mongodb.auto-index-creation=false

# Mongock migrations
mongock.migration-scan-package=com.innowise.paymentservice.migration
mongock.transaction=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false

payment.kafka.topic=${PAYMENT_EVENTS_TOPIC:payment-events}
payment.kafka.partitions=3
payment.kafka.replicas=1

# External payment provider (random number API: even -> SUCCESS, odd -> FAILED)
payment.provider.url=${PAYMENT_PROVIDER_URL:https://www.randomnumberapi.com/api/v1.0/random?min=1&max=100&count=1}
payment.provider.timeout=5s
